{% extends "base.html" %}

{% block content %}
  <section class="panel">
    <div class="panel-header">
      <div>
        <h2>Workflow Dashboard</h2>
        <p>Local progress across discovery, screening, papers, analysis, and drafts.</p>
      </div>
      <a class="button-link" href="/discovery">Import Department</a>
    </div>
    <div class="metric-grid">
      {% for metric in metrics %}
        <div class="metric">
          <span class="metric-label">{{ metric.label }}</span>
          <strong>{{ metric.value }}</strong>
          <p>{{ metric.note }}</p>
        </div>
      {% endfor %}
    </div>
  </section>
{% endblock %}
