[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "professor-outreach-manager"
version = "0.1.0"
description = "Local, human-supervised professor outreach manager."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi>=0.139.0,<0.140.0",
  "httpx>=0.28.0,<0.29.0",
  "jinja2>=3.1.4,<4.0.0",
  "alembic>=1.17.0,<2.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "pydantic-settings>=2.4.0,<3.0.0",
  "pypdf>=6.10.0,<7.0.0",
  "python-multipart>=0.0.31,<0.1.0",
  "pyyaml>=6.0.3,<7.0.0",
  "sqlalchemy>=2.0.40,<3.0.0",
  "starlette>=1.3.1,<2.0.0",
  "uvicorn[standard]>=0.30.0,<0.31.0",
]

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.7.10,<2.0.0",
  "mypy>=1.11.0,<2.0.0",
  "pip-audit>=2.7.3,<3.0.0",
  "pytest>=9.0.3,<10.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "ruff>=0.6.0,<0.7.0",
  "types-PyYAML>=6.0.12,<7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
  "S101",
]

[tool.ruff.lint.per-file-ignores]
"app/routes/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
