[[patterns]]
name = "private-key"
regex = "-----BEGIN (RSA |DSA |EC |OPENSSH )?PRIVATE KEY-----"

[[patterns]]
name = "secret-assignment"
regex = "(?i)(api[_-]?key|secret|token|password)\\s*[:=]\\s*['\\\"][^'\\\"\\s]{16,}['\\\"]"

[[patterns]]
name = "bearer-token"
regex = "(?i)bearer\\s+[a-z0-9._~+/-]{24,}"

